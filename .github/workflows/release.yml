# Tag v0.1.0 → .deb and a bare static binary for amd64/arm64 → GitHub Release.
# The apt repository tihonove/apt picks the .debs up from there; install.sh
# downloads the binary (releases/latest/download/smoothcast-linux-<arch>).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          DEB_VERSION=${GITHUB_REF_NAME#v} debian/build-deb
          cp smoothcast "out/smoothcast-linux-$(dpkg --print-architecture)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: out/*

  release:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
